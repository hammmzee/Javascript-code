<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="display">
            <h2></h2>
        </div>
        <div class="second-half">
            <div class="buttons">
                <div class="first-column">
                    <button>⌫</button>
                    <button>7</button>
                    <button>4</button>
                    <button>1</button>
                    <button>00</button>
                </div>
                <div class="second-column">
                    <button>AC</button>
                    <button>8</button>
                    <button>5</button>
                    <button>2</button>
                    <button>0</button>
                </div>
                <div class="third-column">
                    <button>%</button>
                    <button>9</button>
                    <button>6</button>
                    <button>3</button>
                    <button>.</button>
                </div>
                <div class="fourth-column">
                    <button>÷</button>
                    <button>*</button>
                    <button>-</button>
                    <button>+</button>
                    <button>=</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
